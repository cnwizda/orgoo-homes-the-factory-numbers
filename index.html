.nums button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700}

ol.model{padding-left:18px}ol.model li{margin:6px 0}
.cert{text-align:center}
.cert .name{font-family:Cambria,Georgia,serif;font-size:26px}
.path li{margin:4px 0}
footer.cr{color:var(--muted);font-size:11px;margin-top:24px}
@media (prefers-reduced-motion:no-preference){.anim .card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

{ n: 9, topic: "Tools", title: "The resort project", sub: "HL toolkit: CPA, regression, force field, contribution", code: "NETWORK", img: "plan",

  steps: [
  { id: "d9s1", type: "story", title: "File 9: 40 cabins for Lake Khövsgöl",
    text: `<table class="data"><tr><th>Task</th><th>Depends on</th><th>Weeks</th></tr>
<tr><td>A Design the site layout</td><td>none</td><td>2</td></tr><tr><td>B Build cabin modules</td><td>A</td><td>6</td></tr><tr><td>C Order and receive solar kits</td><td>A</td><td>3</td></tr>
<tr><td>D Fit solar kits</td><td>B, C</td><td>1</td></tr><tr><td>E Transport to Khövsgöl</td><td>D</td><td>2</td></tr><tr><td>F Train resort staff</td><td>A</td><td>2</td></tr><tr><td>G Install and hand over</td><td>E, F</td><td>1</td></tr></table>
<p class="small">🎓 HL only. 📓 Draw the network: calculate each node's EST and LFT. Fictional.</p>` },
  { id: "d9s2", type: "num", topic: "Tools", cmd: "Calculate", marks: 2, hl: true,
    q: "Calculate the minimum time to complete the project, in weeks.",
    formula: "Project length = the longest path through the network", answer: 12, unit: "weeks",
    explain: "A-B-D-E-G = 2 + 6 + 1 + 2 + 1 = <b>12 weeks</b>. A-C-D-E-G = 9; A-F-G = 5." },
  { id: "d9s3", type: "num", topic: "Tools", cmd: "Calculate", marks: 2, hl: true,
    q: "Calculate the total float of task C (solar kits).",
    formula: "Total float = LFT - duration - EST", answer: 3, unit: "weeks",

// ---------------------------------------------------------------- Section B
{ n: 10, topic: "Final", title: "Section B", sub: "Choose one of two questions", code: "SECTIONB", img: "resort",
  terms: ["break-even quantity", "margin of safety", "cost to make", "cost to buy"],
  steps: [
  { id: "d10s0", type: "choice", title: "Choose your Section B question",
    q: "As in the real Paper 2, answer one question. Q3 is SL and HL; Q4 uses HL content.",
    opts: [
      { k: "Q3", t: "A line for Japan (SL and HL)", d: "Should Orgoo start a cabin line for the Japanese market?", val: 0, set: { sectionB: "A" }, out: "Question 3: two calculations, a 4-mark explanation and a 10-mark discussion.", concept: "Section B ends with a 10-mark response that uses your own numbers." },
      { k: "Q4", t: "Make or buy the solar rings (HL)", d: "Should Orgoo make its own solar rings or buy them?", val: 0, set: { sectionB: "B" }, out: "Question 4: two calculations, a 4-mark explanation and a 10-mark recommendation.", concept: "Section B ends with a 10-mark response that uses your own numbers." }
    ] },
  // ---- Q3
  { id: "d10a1", type: "story", title: "Question 3: the Japan line", show: s => s.vars.sectionB === "A",
    text: `<p>A Japanese distributor will sell Orgoo cabins at <b>MNT 8,000,000</b> each. Orgoo's variable cost per Japan cabin is <b>MNT 5,000,000</b> (including shipping). The line adds fixed costs of <b>MNT 600,000,000</b> a year. The distributor forecasts <b>260 cabins</b> a year.</p><p class="small">All figures fictional.</p>` },
  { id: "d10a2", type: "num", topic: "Final", cmd: "Calculate", marks: 2, show: s => s.vars.sectionB === "A",
    q: "Calculate the break-even quantity for the Japan line.",
    formula: "Break-even quantity = fixed costs ÷ (price - variable cost per unit)", answer: 200, unit: "cabins",
    explain: "600,000,000 ÷ (8,000,000 - 5,000,000) = <b>200 cabins</b>." },
  { id: "d10a3", type: "num", topic: "Final", cmd: "Calculate", marks: 2, show: s => s.vars.sectionB === "A",
    q: "Calculate the margin of safety, as a percentage of forecast sales.",
    formula: "Margin of safety % = (forecast - break-even) ÷ forecast × 100", answer: 23.08, unit: "%",
    explain: "(260 - 200) ÷ 260 × 100 = <b>23.1%</b> (60 cabins). Profit at 260 = 60 × 3,000,000 = MNT 180 million." },
  { id: "d10a4", type: "build", topic: "Final", cmd: "Explain", marks: 4, show: s => s.vars.sectionB === "A",
    q: "Explain one advantage and one risk for Orgoo of starting the Japan line. [4]",
    slots: [
      { label: "Advantage: the point", opts: ["A new market adds profit and spreads risk", "It lowers fixed costs", "It needs no distributor"] },
      { label: "Advantage: link to the data", opts: ["Forecast profit of MNT 180 million a year at 260 cabins", "Fixed costs of MNT 600 million", "A price of MNT 5 million"] },
      { label: "Risk: the point", opts: ["The margin of safety is small, so a weak forecast could mean a loss", "Profit is guaranteed", "Japan has no demand"] },
      { label: "Risk: link to the data", opts: ["Sales only 60 cabins (23%) below forecast would wipe out the profit", "The variable cost is MNT 5 million", "The distributor sells at MNT 8 million"] }
    ],
    explain: "Link each point to your break-even calculations." },
  { id: "d10a5", type: "notebook", topic: "Final", cmd: "Discuss", marks: 10, show: s => s.vars.sectionB === "A",
    q: "Using the stimulus and your answers, discuss whether Orgoo should start the cabin line for the Japanese market. [10]",
    guide: ["Define break-even quantity and margin of safety.", "Use your numbers: break-even 200, forecast 260, margin of safety 60 (23%), profit MNT 180m.", "Arguments for: new market, profit, spreading risk, brand.", "Arguments against: forecast risk, fixed costs, distance, culture (HL: Hofstede), limitations of break-even.", "Stakeholders: Tsetseg, workers, the distributor.", "Judgment, the condition it depends on, and the key factor."],
    model: ["<b>Terms:</b> break-even quantity is where total revenue equals total cost; margin of safety is how far sales can fall before a loss.", "<b>Numbers:</b> break-even 200 cabins; forecast 260; margin 60 (23%); profit MNT 180m a year.", "<b>For:</b> profit and growth beyond Mongolia; seasonal demand in Mongolia can be balanced by sales abroad; a premium brand image.", "<b>Against:</b> the forecast comes from the distributor, who gains from orders; a 23% fall wipes out profit; MNT 600m fixed costs must be paid; break-even assumes constant price and costs, but the yen and shipping costs change.", "<b>Stakeholders:</b> workers gain more work; Tsetseg takes the financial risk; the distributor gains sales.", "<b>Judgment:</b> for example, start with a smaller first order or a lower fixed-cost trial; the key factor is how reliable the 260-cabin forecast is."],
    bands: MARKBAND },
  // ---- Q4
  { id: "d10b1", type: "story", title: "Question 4: make or buy the rings (HL)", show: s => s.vars.sectionB === "B",
    text: `<p>Orgoo needs <b>300 solar rings</b> a year. A partner can make them for <b>MNT 750,000</b> each. To make them itself, Orgoo needs equipment and staff costing <b>MNT 60,000,000 a year</b>, plus <b>MNT 500,000</b> of variable cost per ring.</p><p class="small">🎓 HL only. All figures fictional.</p>` },
  { id: "d10b2", type: "num", topic: "Final", cmd: "Calculate", marks: 2, hl: true, show: s => s.vars.sectionB === "B",
    q: "Calculate the [[cost to buy]] (CTB) for 300 rings.",
    formula: "CTB = price per unit × quantity", answer: 225000000, unit: "MNT",
    explain: "750,000 × 300 = <b>MNT 225,000,000</b>." },
  { id: "d10b3", type: "num", topic: "Final", cmd: "Calculate", marks: 2, hl: true, show: s => s.vars.sectionB === "B",
    q: "Calculate the [[cost to make]] (CTM) for 300 rings.",
    formula: "CTM = fixed costs + (average variable cost × quantity)", answer: 210000000, unit: "MNT",
    explain: "60,000,000 + 500,000 × 300 = <b>MNT 210,000,000</b>, MNT 15 million less than buying." },
  { id: "d10b4", type: "build", topic: "Final", cmd: "Explain", marks: 4, hl: true, show: s => s.vars.sectionB === "B",
    q: "Explain one advantage and one disadvantage for Orgoo of making the rings itself. [4]",
    slots: [
      { label: "Advantage: the point", opts: ["Lower cost and more control over quality and the design", "No fixed costs", "No staff needed"] },
      { label: "Advantage: link to the data", opts: ["CTM MNT 210 million against CTB MNT 225 million, and the patented design stays in-house", "300 rings", "MNT 750,000 each"] },
      { label: "Disadvantage: the point", opts: ["Fixed costs remain even if demand falls", "Variable cost is higher", "It always costs more"] },
      { label: "Disadvantage: link to the data", opts: ["MNT 60 million a year must be paid; below 240 rings, buying is cheaper", "The partner charges MNT 750,000", "Orgoo needs 300 rings"] }
    ],
    explain: "Break-even between the two: 60,000,000 ÷ (750,000 - 500,000) = 240 rings." },
  { id: "d10b5", type: "notebook", topic: "Final", cmd: "Recommend", marks: 10, hl: true, show: s => s.vars.sectionB === "B",
    q: "Using the stimulus and your answers, recommend whether Orgoo should make or buy its solar rings. [10]",
    guide: ["Define cost to make and cost to buy.", "Use your numbers: CTM MNT 210m, CTB MNT 225m, the crossover at 240 rings.", "Arguments for making: cost, control, protecting the patented design.", "Arguments for buying: no fixed costs, flexibility, the partner's expertise, focus.", "Stakeholders and risks: demand forecast, quality, the partner.", "Recommendation, the condition it depends on, and the key factor."],
    model: ["<b>Terms:</b> CTM = fixed costs + variable cost × quantity; CTB = price × quantity.", "<b>Numbers:</b> CTM MNT 210m against CTB MNT 225m at 300 rings; making is cheaper above 240 rings.", "<b>Make:</b> saves MNT 15m; controls quality; keeps the patented design secret from an outside maker.", "<b>Buy:</b> no MNT 60m fixed cost; if demand falls below 240, buying is cheaper; Orgoo can focus on gers and cabins.", "<b>Risks:</b> the 300-ring forecast is new and uncertain (5.8); a partner could copy the design if IP protection is weak.", "<b>Recommendation:</b> for example, make the rings if the forecast is reliable and the patent is granted; otherwise buy for the first year. Key factor: confidence in demand above 240 rings."],
    bands: MARKBAND }
  ] }
];

<script>
const KEY = GAME.key;
const MASTER = "MRCHRIS";
let S = load() || fresh();
let ui = {};
function fresh(){ return { name:"", val:10, ch:0, step:0, screen:"start", unlocked:{}, vars:{}, res:{}, master:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => { const r = Math.round(n*10)/10; return r.toLocaleString("en-US"); };
const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function gl(html){
  return String(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === w.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${w}</span>` : w;

  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.set && o.set.entity) S.vars.entityBefore = S.vars.entity;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || [];
    if (ui.tries.includes(i)) return;
    ui.tries.push(i);
    if (i === st.a) return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries });
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || [];
    if (raw.trim() === "") return;
    ui.tries.push(raw);
    if (close(x, val(st.answer)) || (st.alt !== undefined && close(x, val(st.alt)))) return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries });
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const c = document.querySelector('[data-act="code"],[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
